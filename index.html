<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>За горизонтом</title>
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="За горизонтом">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap">
<style>
:root{--bg:#07090f;--fg:#f4f6fa;--mut:#8b94a7;--glow:#9ad0ff;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090f;--fg:#f4f6fa}}
:root[data-theme="dark"]{--bg:#07090f;--fg:#f4f6fa}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow-x:hidden;transition:background .8s}
body[data-el=mountains]{--glow:#9ad0ff;--bg:#0a1626}
body[data-el=sea]{--glow:#6fe0d2;--bg:#07242a}
body[data-el=forest]{--glow:#8fe3a0;--bg:#08170f}
body[data-el=aurora]{--glow:#7dffb5;--bg:#040d1a}
body[data-el=space]{--glow:#b9a4ff;--bg:#0a0614}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px 16px;background:radial-gradient(ellipse at 50% 0%,#16213a 0%,var(--bg) 60%);transition:opacity .6s,transform .6s}
.brand{font:500 13px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--mut)}
h1{font:500 clamp(38px,9vw,72px)/1.05 var(--serif);text-align:center}
.sub{color:var(--mut);font-weight:300;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;width:100%;max-width:1000px}
.card{position:relative;overflow:hidden;min-height:220px;border:1px solid #ffffff1a;border-radius:22px;padding:18px 12px 18px 16px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:var(--fg);cursor:pointer;font:inherit;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s}
.card:hover,.card:focus-visible{transform:scale(1.04);border-color:var(--g);box-shadow:0 0 44px -6px var(--g);outline:none}
.card:active{transform:scale(.99)}
.card svg{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.card b{position:relative;font-family:var(--serif);font-weight:500}
.card span{position:relative;color:#ffffffb3;font-weight:300;font-size:13px;margin-top:2px}
.c-mountains{--g:#9ad0ff;background:linear-gradient(180deg,#14304f,#0a1626 75%)}
.c-sea{--g:#6fe0d2;background:linear-gradient(180deg,#e9b872 0%,#2a8f8f 48%,#07242a 100%)}
.c-forest{--g:#8fe3a0;background:linear-gradient(180deg,#1d5a3a,#08170f 80%)}
.c-aurora{--g:#7dffb5;background:linear-gradient(180deg,#05182b,#0b3a3a 60%,#040d1a)}
.c-space{--g:#b9a4ff;background:radial-gradient(circle at 70% 25%,#2a1a5e,#0a0614 65%)}
.cta{font:400 20px var(--serif);font-style:italic;color:#d6dbe6}
@media (max-width:520px){.card:last-child{grid-column:1/-1}}
#view{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;z-index:5;overflow:hidden}
#view.on{opacity:1;visibility:visible}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#stage video,#stage>div{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#stage video{object-fit:contain}
.still{position:absolute;inset:0;background:#000;overflow:hidden}
.still .ly{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
.still .ly.on{opacity:1}
.still .bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(26px) brightness(.5) saturate(1.2)}
.still .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;color:#c9cfdb;font-size:14px;text-align:center;max-width:min(520px,90vw);line-height:1.5;transition:opacity .5s}
#status.hide{opacity:0;pointer-events:none}
#status i{width:34px;height:34px;border-radius:50%;border:2px solid #ffffff26;border-top-color:var(--glow);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#e5484d;border-radius:99px;padding:3px 9px;margin-bottom:8px}
.live.calm{background:#ffffff1f;border:1px solid #ffffff33;color:#dfe6f2;letter-spacing:.06em;text-transform:none;font-size:11.5px}
.live.calm:before{animation:none;background:var(--glow)}
.live.stale{background:#7a5a1f;border-color:#c8963a}
.vars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.vars:empty{display:none}
.vars .btn{padding:4px 10px;font-size:11px;background:#ffffff12}
.vars .btn[aria-pressed=true]{border-color:var(--glow);background:#ffffff33}
.exts{margin:0 auto 8px;max-width:520px;font-size:12px;color:#c9cfdb}
.exts summary{cursor:pointer;list-style:none;display:inline-block;border:1px solid #ffffff2e;border-radius:99px;padding:4px 11px;background:#ffffff12}
.exts summary::-webkit-details-marker{display:none}
.exts[open] summary{border-color:var(--glow)}
#extl{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin-top:8px}
.exts a{color:var(--glow)}

.card b{font-size:var(--nm,22px);white-space:nowrap;line-height:1.1}.c-aurora b{letter-spacing:0}
.tiles{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;color:var(--fg);font:inherit;cursor:pointer;border:1px solid #ffffff26;border-radius:99px;padding:12px 20px 12px 14px;background:linear-gradient(180deg,#ffffff14,#ffffff08);backdrop-filter:blur(10px);box-shadow:0 10px 30px -14px #000;transition:border-color .3s,box-shadow .3s}
.tile:hover,.tile:focus-visible{border-color:#b9b3ff;box-shadow:0 0 30px -8px #8f86ff;outline:none}
.tile .ic{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff0d;color:#b9b3ff}
.tile .ic svg{width:24px;height:24px}
.tile b{flex:1;min-width:0;font:400 21px var(--serif);letter-spacing:.01em}
.tile b small{display:block;font:300 12px var(--sans);color:var(--mut);margin-top:2px;letter-spacing:.02em}
.tile .ch{color:#ffffff80;font-size:22px}
.ovl{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#16213a 0%,var(--bg) 62%);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.ovl.on{display:flex}
.ovl .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ovl .top h2{font:500 28px var(--serif);flex:1;min-width:0}
.ovl .in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid #ffffff26;border-radius:99px;padding:10px 14px;background:#ffffff0c;color:var(--fg);font:400 15px var(--serif);cursor:pointer}
.tab svg{width:18px;height:18px;color:#b9b3ff}
.tab[aria-pressed=true]{border-color:#b9b3ff;box-shadow:0 0 22px -6px #8f86ff;background:#ffffff1a}
.row{display:flex;align-items:center;gap:14px;border:1px solid #ffffff1f;border-radius:99px;padding:14px 18px;background:#ffffff0d;color:var(--fg);font:400 17px var(--serif);cursor:pointer;text-align:left;width:100%}
.row .st{color:#fff;font-size:20px;flex:none;background:none;border:0;cursor:pointer;padding:0 2px}
.row span{flex:1;min-width:0}
.row .ch{color:#ffffff80;font-size:20px}
.empty{color:var(--mut);text-align:center;padding:30px 10px;font-weight:300;line-height:1.5}
.shot{border:1px solid #ffffff22;border-radius:26px;padding:10px;background:#ffffff0a}
.shot img{display:block;width:100%;border-radius:18px;max-height:60vh;object-fit:cover;background:#000;cursor:pointer}
.shot .cap{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;font:400 16px var(--sans);color:#dfe6f2;letter-spacing:.01em}
.shot .cap button{background:none;border:0;color:#dfe6f2;cursor:pointer;padding:2px}
.shot .cap svg{width:22px;height:22px}
.addb{align-self:flex-start}
#lb{position:fixed;inset:0;z-index:8;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:16px}
#lb .m{color:#dfe6f2;text-align:center;font-size:14px;line-height:1.5}
#lb .bt{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%) translateY(20px);z-index:9;max-width:min(92vw,460px);background:#1d2236f2;color:#eaf0fa;border:1px solid #ffffff33;border-radius:18px;padding:12px 16px;font-size:14px;line-height:1.4;opacity:0;pointer-events:none;transition:.35s}
#toast.on{opacity:1;transform:translateX(-50%)}
#view.imm .bar,#view.imm .foot{display:none}
@media (orientation:landscape) and (max-height:520px){#view{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}#stage{grid-column:1;grid-row:1/3}.bar{grid-column:2;grid-row:1}.foot{grid-column:2;grid-row:2;max-height:none}#view.imm{display:flex}}
.ytf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mode{display:inline-block;font-size:10px;letter-spacing:.14em;border:1px solid #ffffff33;border-radius:6px;padding:1px 6px;margin-right:6px;color:#c9cfdb;vertical-align:1px}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips::before,.chips::after{content:"";margin:auto}
.chips .btn{padding:6px 12px;font-size:12px;flex:none;white-space:nowrap}
.chips .btn[aria-pressed=true]{border-color:var(--glow);background:#ffffff33;box-shadow:0 0 14px -4px var(--glow)}
.bar{position:relative;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:#000;z-index:2}
.bar .r1,.bar .r2{display:flex;align-items:center;gap:8px}
.bar .r2{flex-wrap:wrap}
.bar .r2 .btn{padding:7px 9px;font-size:12px}
#hint{display:none;font-size:12.5px;line-height:1.4;color:#d8e8e0;background:#ffffff18;border:1px solid #ffffff22;border-radius:14px;padding:7px 11px;backdrop-filter:blur(8px)}
#view.hint #hint{display:block}
.btn.on{border-color:var(--glow);background:#ffffff33}
#exitimm{position:fixed;z-index:3;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);opacity:0;pointer-events:none;padding:6px 11px}
#view.imm #exitimm{opacity:.35;pointer-events:auto}
.bar h2{font:500 26px var(--serif);flex:1;min-width:0;text-shadow:0 0 18px var(--glow)}
.btn{background:#ffffff1f;color:var(--fg);border:1px solid #ffffff2e;border-radius:99px;padding:8px 13px;font:400 13px var(--sans);backdrop-filter:blur(8px);cursor:pointer}
.btn:hover{border-color:var(--glow);box-shadow:0 0 18px -4px var(--glow)}
.foot{position:relative;flex:0 0 auto;max-height:44vh;overflow-y:auto;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;background:#000;z-index:2;font-size:13px;line-height:1.5;color:#c9cfdb}
.foot a{color:var(--glow)}
.foot small{display:block;color:#98a0b3;margin-top:4px}
</style>
</head>
<body>
<main id="home">
  <div class="brand">За горизонтом</div>
  <h1>Выбери свою стихию!</h1>
  <p class="sub">Утро начинается с вида</p>
  <div class="cards">
    <button class="card c-mountains" data-k="mountains">
      <svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax slice"><path d="M0 170 60 80 95 130 135 60 200 150V240H0Z" fill="#cfe6ff" opacity=".85"/><path d="M0 200 70 130 120 180 170 120 200 160V240H0Z" fill="#0a1626"/></svg>
      <b>Горы</b><span>Уйти в высоту</span>
    </button>
    <button class="card c-sea" data-k="sea">
      <svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax slice"><circle cx="140" cy="92" r="26" fill="#ffe3a8"/><path d="M0 130q25-10 50 0t50 0 50 0 50 0V240H0Z" fill="#0b4a50" opacity=".7"/><path d="M0 165q25-10 50 0t50 0 50 0 50 0V240H0Z" fill="#07242a" opacity=".85"/></svg>
      <b>Море</b><span>Услышать прибой</span>
    </button>
    <button class="card c-forest" data-k="forest">
      <svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax slice"><g fill="#0c2a1a"><path d="M20 190 45 110 70 190Z"/><path d="M60 200 95 90 130 200Z"/><path d="M120 190 150 115 180 190Z"/></g><g fill="#061409"><path d="M-10 240 30 140 70 240Z"/><path d="M90 240 135 130 180 240Z"/><path d="M150 240 190 150 230 240Z"/></g><circle cx="150" cy="50" r="18" fill="#d8f5c8" opacity=".35"/></svg>
      <b>Лес</b><span>Затеряться среди сосен</span>
    </button>
    <button class="card c-aurora" data-k="aurora">
      <svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb5" stop-opacity="0"/><stop offset=".5" stop-color="#7dffb5" stop-opacity=".75"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><path d="M-10 60Q40 10 90 50T210 40V150Q150 110 100 140T-10 130Z" fill="url(#ag)"/><path d="M-10 110Q50 70 100 100T210 90V170Q150 140 100 165T-10 160Z" fill="url(#ag)" opacity=".5"/><g fill="#fff"><circle cx="30" cy="30" r="1.2"/><circle cx="160" cy="20" r="1"/><circle cx="110" cy="45" r="1.3"/></g><path d="M0 240V205l40-12 45 15 50-18 65 14v36Z" fill="#02060d"/></svg>
      <b>Северное сияние</b><span>Увидеть танец света</span>
    </button>
    <button class="card c-space" data-k="space">
      <svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax slice"><g fill="#fff"><circle cx="30" cy="40" r="1.4"/><circle cx="80" cy="25" r="1"/><circle cx="120" cy="70" r="1.6"/><circle cx="170" cy="40" r="1.2"/><circle cx="55" cy="110" r="1"/><circle cx="150" cy="120" r="1.3"/><circle cx="105" cy="150" r="1"/></g><circle cx="100" cy="300" r="140" fill="#1f4fa8" opacity=".85"/><circle cx="100" cy="300" r="146" fill="none" stroke="#9ad0ff" stroke-opacity=".5" stroke-width="3"/></svg>
      <b>Космос</b><span>Смотреть на Землю</span>
    </button>
  </div>
  <div class="tiles">
    <button class="tile" id="goFav"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.3 5.9 20.9l1.5-6.8L2.2 9.5l6.9-.7z"/></svg></span><b>Избранное<small id="favN"></small></b><span class="ch">›</span></button>
    <button class="tile" id="goShots"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg></span><b>Встречи и впечатления<small id="shotN"></small></b><span class="ch">›</span></button>
  </div>
  <p class="cta">Одна кнопка — и ты уже там</p>
</main>
<section class="ovl" id="fold"><div class="top"><button class="btn" id="foldBack">← Назад</button><h2 id="foldT"></h2></div><div class="in" id="foldL"></div></section>
<section class="ovl" id="lib"><div class="top"><button class="btn" id="libBack">← Назад</button></div><div class="in"><div class="tabs"><button class="tab" id="tabFav" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.3 5.9 20.9l1.5-6.8L2.2 9.5l6.9-.7z"/></svg>Избранное</button><button class="tab" id="tabShots" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>Встречи и впечатления</button></div><div id="libC" class="in" style="max-width:none;margin:0"></div></div></section>
<div id="lb"><img id="lbI" alt=""><div class="m" id="lbM"></div><div class="bt"><button class="btn" id="lbDel">Удалить</button><button class="btn" id="lbX">Закрыть</button></div></div>
<div id="toast"></div>
<input type="file" id="gal" accept="image/*" multiple hidden>
<section id="view" aria-live="polite">
  <div id="stage"></div>
  <div id="status"><i></i><span id="stxt">Подключаемся к камере…</span><button class="btn" id="retry" hidden>Повторить</button></div>
  <button class="btn" id="exitimm" aria-label="Выйти из полноэкранного режима">✕</button><div class="bar"><div class="r1"><button class="btn" id="back">← Назад</button><h2 id="ttl"></h2><button class="btn" id="fs" title="На весь экран, без интерфейса" aria-label="На весь экран">⛶</button></div><div class="r2"><button class="btn" id="amb">🔊 Природа</button><button class="btn" id="snd">🔇 Эфир</button><button class="btn" id="fav" aria-pressed="false">☆ Избранное</button><button class="btn" id="slp" title="Таймер сна">☾ Сон</button><button class="btn" id="grp" hidden></button></div><div id="hint"></div></div>
  <div class="foot"><div class="vars" id="vars"></div><div class="chips" id="chips"></div><span class="live" id="live" hidden>Прямой эфир</span><div id="src"></div><small>Не загрузилось? <a id="ext" target="_blank" rel="noopener">Открыть на сайте источника ↗</a></small></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>if(!window.Hls)document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"><\/script>')</script>
<script>
/* =====================================================================
   Источники — только открытые камеры, без YouTube.
   hls — живое видео (HLS), играет во встроенном плеере (hls.js / Safari)
   img — «живой кадр»: научные и парковые камеры, кадр обновляется сам
   lon — долгота места: камеры, где сейчас светло, показываются первыми
         (для сияния — наоборот, где темно)
   ===================================================================== */
var NPS='https://www.nps.gov/featurecontent/ard/webcams/images/';
var USGS='https://cmgp-coastcam.s3-us-west-2.amazonaws.com/cameras/';
var SWPC='https://services.swpc.noaa.gov/images/animations/';
var KIL='https://volcanoes.usgs.gov/';
var NASA_LIVE='https://www.nasa.gov/live/';
function himaTs(att){var d=new Date(Date.now()-(40+10*(att||0))*60000);d.setUTCMinutes(Math.floor(d.getUTCMinutes()/10)*10,0,0);return d}

var VID="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"2.5\"/><path d=\"M16 10.5l5-3v9l-5-3z\"/></svg>",IMG="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"15\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"M4 18l5.5-5 4 3.5 3-2.5L21 17\"/></svg>",STARI="<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2.5l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.3 5.9 20.9l1.5-6.8L2.2 9.5l6.9-.7z\"/></svg>",CAMI="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z\"/><circle cx=\"12\" cy=\"13.2\" r=\"3.6\"/></svg>",EXPI="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5\"/></svg>",TRASHI="<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13\"/></svg>";
var SHOTS=lsGet('zg_shots',[]);if(!Array.isArray(SHOTS))SHOTS=[];
function p2(n){return ('0'+n).slice(-2)}
function fmtDT(t){var d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' · '+p2(d.getHours())+':'+p2(d.getMinutes())}
var toastT=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},4200)}
function saveShots(){
  for(;;){try{localStorage.setItem('zg_shots',JSON.stringify(SHOTS));return true}catch(e){if(SHOTS.length<=1)return false;SHOTS.pop()}}
}
function addShot(url,t,cam){
  SHOTS.unshift({id:Date.now()+Math.random(),t:t||Date.now(),src:url,cam:cam||''});
  SHOTS.sort(function(a,b){return b.t-a.t});if(SHOTS.length>40)SHOTS.length=40;
  var n=SHOTS.length,ok=saveShots();
  renderFavs();if(libTab==='shots'&&lib.classList.contains('on'))renderLib();
  return ok&&SHOTS.length===n;
}
/* кадр -> JPEG не шире 960 px */
function toJpeg(src,w,h){
  var k=Math.min(1,960/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78);
}
/* YouTube не разрешает сохранять кадры трансляции в стороннем приложении, поэтому снимки добавляет сам пользователь: скриншот из галереи */
/* скриншот из галереи: дата и время берутся из самого файла */
var gal=document.getElementById('gal');
gal.addEventListener('change',function(){
  var fs=[].slice.call(gal.files||[]);gal.value='';
  fs.forEach(function(f){
    var r=new FileReader();r.onload=function(){
      var im=new Image();im.onload=function(){try{addShot(toJpeg(im,im.naturalWidth,im.naturalHeight),f.lastModified||Date.now(),'Мой снимок')}catch(x){toast('Не удалось добавить этот файл')}};
      im.onerror=function(){toast('Не удалось открыть изображение')};im.src=r.result};
    r.readAsDataURL(f)});
});
/* ---------- «Избранное» и «Встречи и впечатления» ---------- */
var lib=document.getElementById('lib'),libTab='fav';
function setTab(t){libTab=t;document.getElementById('tabFav').setAttribute('aria-pressed',t==='fav');document.getElementById('tabShots').setAttribute('aria-pressed',t==='shots');renderLib()}
function openLib(t){document.body.dataset.el='';delete document.body.dataset.el;lib.classList.add('on');setTab(t)}
function renderLib(){
  var box=document.getElementById('libC');box.innerHTML='';
  if(libTab==='fav'){
    var ok=FAV.filter(function(f){return EL[f.split('|')[0]]});
    if(!ok.length){box.innerHTML='<div class="empty">Здесь появятся ваши любимые камеры.<br>Нажмите «☆ Избранное» в окне камеры.</div>';return}
    ok.forEach(function(f){var p=f.split('|'),nm=f.slice(p[0].length+1);
      var r=document.createElement('div');r.className='row';r.setAttribute('role','button');r.tabIndex=0;
      r.innerHTML='<button class="st" aria-label="Убрать из избранного">★</button><span></span><i class="ch" style="font-style:normal">›</i>';
      r.querySelector('span').textContent=EL[p[0]].t+' · '+nm;
      r.querySelector('.st').onclick=function(ev){ev.stopPropagation();FAV.splice(FAV.indexOf(f),1);lsSet('zg_fav',FAV);renderFavs();renderLib()};
      r.onclick=function(){lib.classList.remove('on');open(p[0],nm)};
      r.onkeydown=function(ev){if(ev.key==='Enter')r.onclick()};
      box.appendChild(r)});
  }else{
    var add=document.createElement('button');add.className='btn addb';add.textContent='＋ Загрузить скриншот';add.onclick=function(){gal.click()};box.appendChild(add);
    if(!SHOTS.length){var em=document.createElement('div');em.className='empty';em.innerHTML='Здесь будут ваши встречи и впечатления.<br>Сделайте скриншот на телефоне и загрузите его кнопкой выше. Дата и время подставятся из файла.';box.appendChild(em);return}
    SHOTS.forEach(function(sh){
      var c=document.createElement('div');c.className='shot';
      c.innerHTML='<img alt=""><div class="cap"><span></span><button aria-label="Открыть">'+EXPI+'</button></div>';
      c.querySelector('img').src=sh.src;c.querySelector('span').textContent=fmtDT(sh.t);
      c.querySelector('img').onclick=c.querySelector('button').onclick=function(){openLb(sh)};
      box.appendChild(c)});
  }
}
var lbCur=null;
function openLb(sh){lbCur=sh;document.getElementById('lbI').src=sh.src;document.getElementById('lbM').textContent=fmtDT(sh.t)+(sh.cam?' · '+sh.cam:'');document.getElementById('lb').classList.add('on')}
document.getElementById('lbX').onclick=function(){document.getElementById('lb').classList.remove('on')};
document.getElementById('lbDel').onclick=function(){if(!lbCur)return;var i=SHOTS.indexOf(lbCur);if(i>=0)SHOTS.splice(i,1);saveShots();document.getElementById('lb').classList.remove('on');renderFavs();renderLib()};
document.getElementById('lb').addEventListener('click',function(ev){if(ev.target.id==='lb')this.classList.remove('on')});
document.getElementById('tabFav').onclick=function(){setTab('fav')};
document.getElementById('tabShots').onclick=function(){setTab('shots')};
document.getElementById('libBack').onclick=function(){lib.classList.remove('on')};
document.getElementById('goFav').onclick=function(){openLib('fav')};
document.getElementById('goShots').onclick=function(){openLib('shots')};

renderFavs();

/* названия стихий — одного размера; размер подбирается так, чтобы «Северное сияние» занимало всю ширину карточки */
function fitNames(){
  var a=document.querySelector('.c-aurora b');if(!a)return;
  var root=document.documentElement;root.style.setProperty('--nm','100px');
  var card=a.parentElement,cs=getComputedStyle(card),w=card.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  var need=a.scrollWidth||a.getBoundingClientRect().width;
  root.style.setProperty('--nm',Math.max(14,Math.min(30,Math.floor(100*w/need*10)/10))+'px');
}
fitNames();window.addEventListener('resize',fitNames);window.addEventListener('load',fitNames);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitNames);
/* ---------- на весь экран / без интерфейса ---------- */
function setImm(on){
  view.classList.toggle('imm',!!on);
  var d=document,de=d.documentElement;
  try{
    if(on){var f=de.requestFullscreen||de.webkitRequestFullscreen;if(f&&!d.fullscreenElement&&!d.webkitFullscreenElement){var p=f.call(de);if(p&&p.catch)p.catch(function(){})}}
    else{var x=d.exitFullscreen||d.webkitExitFullscreen;if(x&&(d.fullscreenElement||d.webkitFullscreenElement)){var q=x.call(d);if(q&&q.catch)q.catch(function(){})}}
  }catch(e){}
}
document.getElementById('fs').addEventListener('click',function(ev){ev.stopPropagation();setImm(true)});
document.getElementById('exitimm').addEventListener('click',function(ev){ev.stopPropagation();setImm(false)});
view.addEventListener('click',function(){if(view.classList.contains('imm'))setImm(false)});
function fsChange(){if(!document.fullscreenElement&&!document.webkitFullscreenElement&&view.classList.contains('imm'))view.classList.remove('imm')}
document.addEventListener('fullscreenchange',fsChange);document.addEventListener('webkitfullscreenchange',fsChange);
/* ---------- таймер сна: звук плавно затихает, потом возврат на главную ---------- */
var SLP=[0,15,30,60],slpI=0,slpEnd=0,slpT=null,slpBtn=document.getElementById('slp');
function slpStop(){clearInterval(slpT);slpT=null;slpI=0;slpEnd=0;slpBtn.textContent='☾ Сон';slpBtn.classList.remove('on')}
function slpTick(){
  var left=Math.round((slpEnd-Date.now())/1000);
  if(left<=0){var m=master;if(m&&ac)m.gain.setTargetAtTime(0,ac.currentTime,.3);close();return}
  if(left<=12){if(master&&ac)master.gain.setTargetAtTime(0,ac.currentTime,3);if(video&&!video.muted)video.volume=Math.max(0,left/12)}
  slpBtn.textContent='☾ '+(left>=60?Math.ceil(left/60)+' мин':left+' с');
}
slpBtn.addEventListener('click',function(){
  slpI=(slpI+1)%SLP.length;clearInterval(slpT);
  if(!SLP[slpI]){slpStop();return}
  slpEnd=Date.now()+SLP[slpI]*60000;slpBtn.classList.add('on');slpTick();slpT=setInterval(slpTick,1000);
});
/* ---------- экран не гаснет, пока смотришь ---------- */
var wl=null;
function wakeOn(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view.classList.contains('on'))wakeOn()});
/* ---------- сияние: где сейчас ночь и индекс активности Kp ---------- */
var kpCache={t:0,v:null};
function kpText(kp){
  if(kp<2)return 'Kp '+kp+' — очень спокойно, сияние только у самого полярного круга';
  if(kp<4)return 'Kp '+kp+' — спокойно, сияние видно на крайнем севере';
  if(kp<5)return 'Kp '+kp+' — слабое возмущение, сияние выше 60° с. ш.';
  if(kp<7)return 'Kp '+kp+' — магнитная буря: хороший шанс на яркое сияние';
  return 'Kp '+kp+' — сильная буря: сияние может быть видно очень далеко на юг';
}
function updateHint(){
  var h=document.getElementById('hint');
  var dark=EL.aurora.src.filter(function(c){return c.lon!==undefined&&!isDay(c.lon)}).map(function(c){return c.name.replace(/ ·.*$/,'')});
  var uniq=dark.filter(function(n,i){return dark.indexOf(n)===i});
  var a=uniq.length?'🌙 Сейчас ночь: '+uniq.join(', '):'☀ Сейчас на всех камерах день — сияние видно в тёмное время суток';
  h.textContent=a;
  function show(kp){if(kp!=null&&!isNaN(kp))h.textContent=a+' · '+kpText(Math.round(kp*10)/10)}
  if(kpCache.v!=null&&Date.now()-kpCache.t<600000){show(kpCache.v);return}
  try{fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json').then(function(r){return r.json()}).then(function(j){
    var last=j[j.length-1],kp=parseFloat(Array.isArray(last)?last[1]:last.Kp);
    kpCache={t:Date.now(),v:kp};if(cur==='aurora')show(kp)}).catch(function(){})}catch(e){}
}

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
